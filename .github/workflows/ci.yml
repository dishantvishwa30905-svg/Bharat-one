name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Cancel outdated workflow runs for the same ref when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Dummy non-secret environment variables for build-time validation
    env:
      DATABASE_URL: "file:./prisma/dev.db"
      JWT_SECRET: "ci-testing-jwt-secret-key-32-chars-long"
      AUTH_SECRET: "ci-testing-auth-secret-key-32-chars"
      PORT: 3000

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20 environment with npm package caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install exact project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Generate Prisma Client artifacts
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup SQLite database for CI
        run: npx prisma db push --skip-generate

      # Step 6: Validate ESLint code quality rules
      - name: Run Next.js Linter
        run: npm run lint

      # Step 7: Run TypeScript type checking
      - name: Run Typecheck
        run: npx tsc --noEmit

      # Step 8: Perform Next.js production build compilation
      - name: Build Next.js Application
        run: npm run build
