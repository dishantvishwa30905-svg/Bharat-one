name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./prisma/dev.db"
      JWT_SECRET: "ci-testing-jwt-secret-key-32-chars-long"
      AUTH_SECRET: "ci-testing-auth-secret-key-32-chars"
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup SQLite database for CI
        run: node --use-system-ca node_modules/prisma/build/index.js db push

      - name: Run Next.js Linter
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
