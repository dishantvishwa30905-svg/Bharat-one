<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <!-- Definition for Gradient and Chakra -->
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF6600" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128807" />
      <stop offset="100%" stop-color="#0F6F05" />
    </linearGradient>
  </defs>
  
  <!-- Stylized B Icon -->
  <g transform="translate(10, 10)">
    <!-- Top Saffron Loop -->
    <path d="M 30,10 
             C 65,10 80,25 75,45 
             C 71,60 55,62 45,62 
             L 30,62 Z" 
          fill="url(#saffronGrad)" />
          
    <!-- Bottom Green Loop -->
    <path d="M 30,62 
             C 60,62 76,65 80,82 
             C 85,100 60,110 30,110 
             L 22,110
             C 12,85 10,40 30,10 Z" 
          fill="url(#greenGrad)" />
          
    <!-- White Inner Circles cutout emulation -->
    <path d="M 35,20 L 50,20 C 58,20 63,24 61,32 C 59,40 50,42 40,42 L 35,42 Z" fill="#FFFFFF" />
    <path d="M 35,72 L 52,72 C 60,72 65,77 63,88 C 61,96 50,100 35,100 Z" fill="#FFFFFF" />
    
    <!-- Ashoka Chakra in bottom loop center -->
    <g transform="translate(48, 86)">
      <!-- Outer Ring -->
      <circle r="12" fill="none" stroke="#000088" stroke-width="1.8" />
      <!-- Inner Hub -->
      <circle r="2.5" fill="#000088" />
      <!-- Spokes (24 spokes represented by lines) -->
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#000088" stroke-width="0.6" />
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#000088" stroke-width="0.6" />
      <line x1="-8.48" y1="-8.48" x2="8.48" y2="8.48" stroke="#000088" stroke-width="0.6" />
      <line x1="-8.48" y1="8.48" x2="8.48" y2="-8.48" stroke="#000088" stroke-width="0.6" />
      <line x1="-4.6" y1="-11.1" x2="4.6" y2="11.1" stroke="#000088" stroke-width="0.6" />
      <line x1="-11.1" y1="-4.6" x2="11.1" y2="4.6" stroke="#000088" stroke-width="0.6" />
      <line x1="-11.1" y1="4.6" x2="11.1" y2="-4.6" stroke="#000088" stroke-width="0.6" />
      <line x1="-4.6" y1="11.1" x2="4.6" y2="-11.1" stroke="#000088" stroke-width="0.6" />
    </g>
  </g>

  <!-- Typography Text -->
  <text x="110" y="60" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#0D1B3D">BHARAT ONE</text>
  <text x="112" y="88" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="13" fill="#6C7280" letter-spacing="0.5">One Platform. Every Scheme. <tspan fill="#128807">Your Benefits.</tspan></text>
</svg>
